<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f17">
<title>StockLock OS — Car Accessories Business OS</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%233b82f6'/><path d='M50 22a14 14 0 0 0-14 14v8h-4a4 4 0 0 0-4 4v22a4 4 0 0 0 4 4h36a4 4 0 0 0 4-4V48a4 4 0 0 0-4-4h-4v-8a14 14 0 0 0-14-14zm-8 22v-8a8 8 0 0 1 16 0v8z' fill='white'/></svg>">
<style>
:root{
  --bg:#0b0f17; --bg2:#0d121c; --panel:#141a26; --panel2:#1a2230; --panel3:#212c3d; --line:#27313f; --line2:#323e50;
  --txt:#e8eef6; --mut:#93a1b5; --mut2:#64748b;
  --accent:#3b82f6; --accent2:#2563eb; --accentbg:#10233f;
  --green:#22c55e; --greenbg:#0e2a1b; --amber:#f59e0b; --amberbg:#2a210a; --red:#ef4444; --redbg:#2a1314;
  --purple:#a855f7; --purplebg:#221140; --cyan:#06b6d4; --cyanbg:#082831; --pink:#ec4899;
  --radius:14px; --radius-sm:10px; --shadow:0 10px 30px rgba(0,0,0,.4); --shadow-sm:0 4px 14px rgba(0,0,0,.3);
  font-synthesis:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3849;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
::selection{background:#2563eb55}

/* ===================== LOGIN ===================== */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;
  background:radial-gradient(1100px 600px at 70% -10%,#16243f 0%,var(--bg) 55%),radial-gradient(900px 500px at 10% 110%,#1a1330 0%,transparent 60%);padding:18px}
.login-wrap{display:grid;grid-template-columns:1.1fr .9fr;max-width:920px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.login-hero{padding:36px;background:linear-gradient(160deg,#152banner,#0e1626);background:linear-gradient(160deg,#16243f,#0e1626);position:relative;overflow:hidden}
.login-hero .glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#3b82f655,transparent 70%);top:-80px;right:-60px}
.login-hero h1{font-size:24px;margin:18px 0 6px}
.login-hero p{color:var(--mut);font-size:13.5px;max-width:330px}
.hero-feats{margin-top:22px;display:flex;flex-direction:column;gap:11px}
.hero-feats .f{display:flex;gap:11px;align-items:flex-start;font-size:13px}
.hero-feats .f .fi{width:30px;height:30px;border-radius:9px;background:#ffffff10;display:grid;place-items:center;flex:none;font-size:15px}
.hero-feats .f b{display:block} .hero-feats .f span{color:var(--mut);font-size:12px}
.login-form{padding:34px 30px}
.login-form h2{font-size:15px;color:var(--mut);font-weight:500;margin:0 0 14px}
.user-pick{display:flex;flex-direction:column;gap:9px;max-height:330px;overflow:auto;padding-right:4px}
.user-pick button{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:11px 13px;border-radius:11px;text-align:left;transition:.14s}
.user-pick button:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.user-pick .av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.user-pick .nm{font-weight:600;font-size:13.5px}.user-pick .mt2{font-size:11.5px;color:var(--mut)}
.user-pick .rl{margin-left:auto;font-size:10.5px;color:var(--mut);background:#0b1018;padding:4px 9px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--purple));font-weight:800;font-size:22px;color:#fff;box-shadow:0 6px 18px #3b82f655}
.login-foot{margin-top:16px;font-size:11px;color:var(--mut2);text-align:center}
@media(max-width:720px){.login-wrap{grid-template-columns:1fr}.login-hero{display:none}}

/* ===================== SHELL ===================== */
#app{display:none;height:100%}
.shell{display:grid;grid-template-columns:236px 1fr;height:100vh}
.side{background:linear-gradient(180deg,#10151f,#0c111a);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.side .top{padding:15px 15px 11px;border-bottom:1px solid var(--line)}
.side .top .sub{font-size:11px;color:var(--mut)}
.side .top h1{font-size:15px;margin:0}
.nav{flex:1;overflow:auto;padding:8px 9px}
.nav .grp{color:var(--mut2);font-size:10px;text-transform:uppercase;letter-spacing:1.2px;margin:14px 9px 5px;font-weight:700}
.nav button{width:100%;display:flex;align-items:center;gap:11px;background:none;border:none;color:var(--mut);padding:9px 11px;border-radius:9px;font-size:13.5px;text-align:left;transition:.12s;position:relative}
.nav button .ic{width:20px;text-align:center;font-size:15px}
.nav button:hover{background:var(--panel2);color:var(--txt)}
.nav button.active{background:linear-gradient(90deg,#3b82f626,transparent);color:#fff}
.nav button.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--accent)}
.nav button .badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;min-width:18px;text-align:center}
.nav button .badge.amber{background:var(--amber);color:#1a1200}.nav button .badge.blue{background:var(--accent)}
.side .me{padding:11px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px;flex:none}
.side .me .nm{font-size:13px;font-weight:600;line-height:1.1}.side .me .rl{font-size:11px;color:var(--mut)}
.side .me .out{margin-left:auto;background:none;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 9px;font-size:13px}
.side .me .out:hover{color:var(--red);border-color:var(--red)}

.main{min-height:0;overflow:auto;display:flex;flex-direction:column;background:var(--bg)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(11,15,23,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 22px;display:flex;align-items:center;gap:14px}
.topbar h2{margin:0;font-size:18px}.topbar .crumb{color:var(--mut);font-size:11.5px}
.topbar .spacer{flex:1}
.searchk{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--mut);font-size:12.5px;cursor:pointer;transition:.14s}
.searchk:hover{border-color:var(--accent);color:var(--txt)}
.searchk kbd{background:#0b1018;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:10px;font-family:inherit}
.iconbtn{width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);display:grid;place-items:center;font-size:15px;position:relative}
.iconbtn:hover{color:var(--txt);border-color:var(--accent)}
.iconbtn .dotn{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--red);border:2px solid var(--panel)}
.branch-pick{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;font-size:12.5px}
.branch-pick select{background:none;border:none;color:var(--txt);font-size:12.5px;font-weight:600;outline:none;max-width:160px}
.content{padding:20px 22px 70px;max-width:1320px;width:100%}
@media(max-width:880px){.shell{grid-template-columns:1fr}.side{position:fixed;left:-260px;top:0;bottom:0;width:236px;z-index:60;transition:.2s;box-shadow:var(--shadow)}.side.open{left:0}.menu-btn{display:grid!important}.searchk .lbl{display:none}}
.menu-btn{display:none;width:34px;height:34px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--txt);place-items:center;font-size:17px}

/* ===================== GENERIC ===================== */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px}
.card.tight{padding:14px}
.card h3{margin:0 0 3px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card .desc{color:var(--mut);font-size:12px;margin-bottom:13px}
.grid{display:grid;gap:15px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:1.3fr .7fr}.g32{grid-template-columns:.62fr .38fr}
@media(max-width:1100px){.g3,.g4{grid-template-columns:repeat(2,1fr)}.g23,.g32{grid-template-columns:1fr}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}

.kpi{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:var(--radius);padding:15px;position:relative;overflow:hidden}
.kpi .lab{color:var(--mut);font-size:11.5px;font-weight:500}
.kpi .val{font-size:25px;font-weight:800;margin-top:5px;letter-spacing:-.5px}
.kpi .sub{font-size:11px;margin-top:4px;color:var(--mut);display:flex;align-items:center;gap:5px}
.kpi .ic{position:absolute;right:13px;top:13px;font-size:20px;opacity:.55}
.kpi.good .val{color:var(--green)}.kpi.warn .val{color:var(--amber)}.kpi.bad .val{color:var(--red)}
.trend{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:20px}
.trend.up{background:var(--greenbg);color:#5de090}.trend.down{background:var(--redbg);color:#ff8585}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.pill.green{background:var(--greenbg);color:#5de090;border-color:#1c5235}
.pill.amber{background:var(--amberbg);color:#fbbf24;border-color:#5c460f}
.pill.red{background:var(--redbg);color:#ff8585;border-color:#5c2020}
.pill.blue{background:var(--accentbg);color:#7dafff;border-color:#1d3a63}
.pill.purple{background:var(--purplebg);color:#cda8ff;border-color:#44256e}
.pill.cyan{background:var(--cyanbg);color:#5fd6e6;border-color:#0e4f5c}
.pill.gray{background:#1a212c;color:var(--mut);border-color:var(--line)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
td{padding:10px 12px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}
.t-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--accent);color:#fff;border:none;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;transition:.14s;white-space:nowrap}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}.btn.ghost:hover{border-color:var(--accent)}
.btn.green{background:var(--green);color:#04210f}.btn.green:hover{background:#16a34a;color:#fff}
.btn.red{background:var(--red)}.btn.red:hover{background:#dc2626}
.btn.amber{background:var(--amber);color:#231700}.btn.amber:hover{background:#d97706;color:#fff}
.btn.sm{padding:6px 11px;font-size:12px}.btn.xs{padding:4px 9px;font-size:11px;border-radius:7px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}

input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:#0e1420}
label.fld{display:block;margin-bottom:11px}
label.fld span{display:block;font-size:11.5px;color:var(--mut);margin-bottom:5px}

.searchbar{position:relative}
.searchbar input{padding-left:38px;font-size:15px;padding-top:12px;padding-bottom:12px}
.searchbar .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:15px}

.photo{width:46px;height:46px;border-radius:9px;display:grid;place-items:center;font-size:18px;background:linear-gradient(135deg,#1c2a40,#10161f);border:1px solid var(--line);flex:none}
.photo.lg{width:60px;height:60px;font-size:24px}
.thumb-row{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-size:13px;background:var(--panel2);border:1px solid var(--line)}

.tabs{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:15px;overflow:auto}
.tabs button{flex:1;background:none;border:none;color:var(--mut);padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:600;white-space:nowrap;transition:.12s}
.tabs button.on{background:var(--accent);color:#fff}
.tabs button:hover:not(.on){color:var(--txt);background:#ffffff08}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(3,6,12,.72);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:70;padding:18px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:580px;max-width:97vw;max-height:92vh;overflow:auto;box-shadow:var(--shadow);animation:pop .18s}
.modal.wide{width:780px}.modal.xl{width:980px}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.modal .mh h3{margin:0;font-size:16px}.modal .mh .x{background:none;border:none;color:var(--mut);font-size:22px;line-height:1}
.modal .mb{padding:20px}.modal .mf{padding:13px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel)}

/* toast */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:90}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:12px 15px;min-width:270px;max-width:340px;box-shadow:var(--shadow);animation:slidein .25s;display:flex;gap:11px}
.toast.green{border-left-color:var(--green)}.toast.red{border-left-color:var(--red)}.toast.amber{border-left-color:var(--amber)}
.toast .ti{font-size:18px}.toast .tt{font-weight:700;font-size:13px}.toast .tx{color:var(--mut);font-size:12px;margin-top:1px}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:13px 0}
.flow .step{font-size:11px;padding:6px 11px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--mut)}
.flow .step.on{background:var(--accentbg);border-color:var(--accent);color:#bcd6ff;font-weight:600}
.flow .step.done{background:var(--greenbg);border-color:#1c5235;color:#5de090}
.flow .arr{color:var(--mut2)}

.muted{color:var(--mut)}.small{font-size:12px}.tiny{font-size:11px}.b{font-weight:700}.sb{font-weight:600}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.right{text-align:right}.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mt{margin-top:13px}.mt2{margin-top:8px}.mb0{margin-bottom:0}.gap6{gap:6px}.gap8{gap:8px}
hr.sep{border:none;border-top:1px solid var(--line);margin:13px 0}

.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:12px;margin-bottom:15px}
.banner.bad{background:var(--redbg);border:1px solid #5c2020}.banner.good{background:var(--greenbg);border:1px solid #1c5235}
.banner.warn{background:var(--amberbg);border:1px solid #5c460f}.banner.info{background:var(--accentbg);border:1px solid #1d3a63}
.banner .bi{font-size:25px}.banner .bt{font-weight:700;font-size:13.5px}.banner .bd{font-size:12px;color:var(--mut)}

.progress{height:8px;background:var(--panel2);border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#16a34a);transition:width .4s}
.progress.amber>i{background:linear-gradient(90deg,var(--amber),#d97706)}
.progress.red>i{background:linear-gradient(90deg,var(--red),#dc2626)}

.empty{padding:46px;text-align:center;color:var(--mut2)}.empty .e-ic{font-size:36px;margin-bottom:8px}

.miniwrap{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:12px}
.kbox{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--mut)}
.legend .l{display:flex;align-items:center;gap:6px}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px}
.chip.on{background:var(--accentbg);border-color:var(--accent);color:#bcd6ff}

/* command palette */
.cmdk-bg{position:fixed;inset:0;background:rgba(3,6,12,.6);backdrop-filter:blur(3px);z-index:95;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.cmdk{width:560px;max-width:94vw;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.cmdk input{border:none;border-bottom:1px solid var(--line);border-radius:0;padding:15px 18px;font-size:15px;background:var(--panel)}
.cmdk-list{max-height:340px;overflow:auto;padding:7px}
.cmdk-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;cursor:pointer;font-size:13.5px}
.cmdk-item:hover,.cmdk-item.sel{background:var(--panel2)}
.cmdk-item .ic{width:22px;text-align:center}.cmdk-item .meta{margin-left:auto;font-size:11px;color:var(--mut)}
.cmdk-cat{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut2);padding:9px 12px 4px;font-weight:700}

.statusdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.av-stack{display:flex}.av-stack .avatar{margin-left:-8px;border:2px solid var(--panel)}.av-stack .avatar:first-child{margin-left:0}

.bar-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.bar-row .bl{width:90px;font-size:12px;color:var(--mut);flex:none}
.bar-row .bt{width:54px;text-align:right;font-size:12px;font-weight:700;flex:none}
.bar-track{flex:1;height:9px;background:var(--panel2);border-radius:9px;overflow:hidden}
.bar-track>i{display:block;height:100%;border-radius:9px}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:5px 0 13px}
.tl-item::before{content:"";position:absolute;left:-18px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.tl-item.green::before{background:var(--green)}.tl-item.red::before{background:var(--red)}.tl-item.amber::before{background:var(--amber)}

</style>
</head>
<body>
  <div id="login"></div>
  <div id="app"></div>
  <div id="toasts"></div>
<script>
/* ============================================================
   StockLock OS — LEVEL 4 advanced seed data
   ============================================================ */
window.STOCKLOCK_SEED = {
  company:{ id:"kalra", name:"Kalra Car Accessories", gstin:"07AABCK1234M1Z5", currency:"₹", est:2009 },

  branches:[

const DB_KEY="stocklock_v4";
let DB=null, SESSION=null, VIEW_BRANCH="main", ROUTE="dash";

function loadDB(){const r=localStorage.getItem(DB_KEY);if(r){try{return JSON.parse(r)}catch(e){}}return JSON.parse(JSON.stringify(window.STOCKLOCK_SEED));}
function saveDB(){try{localStorage.setItem(DB_KEY,JSON.stringify(DB))}catch(e){}}
function resetDB(){localStorage.removeItem(DB_KEY);location.reload();}

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const k in attrs){if(k==="class")n.className=attrs[k];else if(k==="html")n.innerHTML=attrs[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2).toLowerCase(),attrs[k]);else if(attrs[k]!=null&&attrs[k]!==false)n.setAttribute(k,attrs[k]);}kids.flat().forEach(c=>n.append(c&&c.nodeType?c:document.createTextNode(c==null?"":c)));return n;};
const money=n=>DB.company.currency+Number(Math.round(n||0)).toLocaleString("en-IN");
const moneyK=n=>{n=n||0;return n>=10000000?DB.company.currency+(n/10000000).toFixed(2)+"Cr":n>=100000?DB.company.currency+(n/100000).toFixed(2)+"L":n>=1000?DB.company.currency+(n/1000).toFixed(1)+"k":money(n);};
const uid=p=>p+Math.random().toString(36).slice(2,7);
const branchName=id=>(DB.branches.find(b=>b.id===id)||{}).name||id;
const branchShort=id=>{const b=DB.branches.find(b=>b.id===id);return b?b.name.replace(/ \(.*\)/,""):id;};
const product=id=>DB.products.find(p=>p.id===id)||{name:"?",sku:"?",img:"📦",mrp:0,cost:0};
const customer=id=>DB.customers.find(c=>c.id===id)||{name:"Walk-in",phone:"—",vehicle:"—"};
const vendor=id=>DB.vendors.find(v=>v.id===id)||{name:"—"};
const staffById=id=>DB.staff.find(s=>s.id===id)||{name:"—"};
function matchProduct(p,q){q=(q||"").trim().toLowerCase();if(!q)return true;const h=(p.name+" "+p.sku+" "+p.cat).toLowerCase();return q.split(/\s+/).every(w=>h.includes(w));}
function distanceRank(from){const o={main:["pit","roh","mod","jnk","dwk","lax"],roh:["main","pit","mod"],pit:["roh","main","mod"],dwk:["jnk","main","lax"],jnk:["dwk","main","lax"],mod:["pit","roh","main"],lax:["dwk","jnk","main"]};return o[from]||["main"];}

/* ----- ledger ----- */
function stockOf(pid,bid){let q=0;for(const r of DB.ledger){if(Array.isArray(r)){if(r[0]===pid&&r[1]===bid)q+=r[2];}else if(r.product===pid&&r.branch===bid)q+=r.delta;}return q;}
function postLedger(pid,bid,delta,reason,ref){DB.ledger.push({id:uid("L"),product:pid,branch:bid,delta,reason,ref:ref||null,actor:SESSION.user.name,at:nowStamp()});}
function totalStock(pid){return DB.branches.reduce((s,b)=>s+stockOf(pid,b.id),0);}
function stockStatus(pid,bid){const q=stockOf(pid,bid),re=DB.reorder[pid]||0;if(q<=0)return{q,label:"Need stock",cls:"red"};if(q===1)return{q,label:"Last piece",cls:"amber"};if(re&&q<=re)return{q,label:"Low",cls:"amber"};return{q,label:"Safe",cls:"green"};}
function stockValue(){return DB.products.reduce((s,p)=>s+totalStock(p.id)*p.cost,0);}
function nowStamp(){const d=new Date();return "Today "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});}
function audit(action,cat){DB.audit.unshift({at:"just now",actor:SESSION.user.name,action,cat:cat||"other"});}

function lineChart(data,key,color="#3b82f6",h=140){
  const w=560,pad=10,vals=data.map(d=>d[key]),max=Math.max(...vals)*1.1,min=Math.min(...vals)*.85;
  const x=i=>pad+i*((w-2*pad)/(data.length-1));
  const y=v=>h-pad-((v-min)/(max-min))*(h-2*pad);
  const pts=vals.map((v,i)=>[x(i),y(v)]);
  const path=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=path+` L${x(data.length-1)} ${h-pad} L${pad} ${h-pad} Z`;
  const id="g"+Math.random().toString(36).slice(2,6);
  let svg=`<svg viewBox="0 0 ${w} ${h+22}" style="width:100%;height:auto">`;
  svg+=`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
  svg+=`<path d="${area}" fill="url(#${id})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p,i)=>{svg+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.2" fill="${color}"/>`;svg+=`<text x="${p[0]}" y="${h+16}" fill="#64748b" font-size="11" text-anchor="middle">${data[i].d}</text>`;});
  svg+=`</svg>`;return svg;
}
function donutChart(segments,size=130){ // [{label,value,color}]
  const total=segments.reduce((s,x)=>s+x.value,0)||1;let acc=0;const r=size/2-8,cx=size/2,cy=size/2,C=2*Math.PI*r;
  let svg=`<svg viewBox="0 0 ${size} ${size}" style="width:${size}px;height:${size}px">`;
  svg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#1a2230" stroke-width="14"/>`;
  segments.forEach(s=>{const frac=s.value/total;const dash=frac*C;svg+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="14" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-acc*C}" transform="rotate(-90 ${cx} ${cy})"/>`;acc+=frac;});
  svg+=`<text x="${cx}" y="${cy-2}" fill="#e8eef6" font-size="18" font-weight="700" text-anchor="middle">${segments.length}</text>`;
  svg+=`<text x="${cx}" y="${cy+15}" fill="#64748b" font-size="10" text-anchor="middle">categories</text></svg>`;
  return svg;
}
